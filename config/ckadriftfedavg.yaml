# config/ckadriftfedavg.yaml
# CKA Representation Drift experiment configuration — FedAvg baseline
# Extends driftfedavg.yaml with CKA measurement instrumentation.
# Methodology Sections 3.1–3.3 (drift) + CKA layer-alignment analysis.
#
# LR scheduler note: lr_scheduler.name is null here because the server
# implements CosineAnnealingLR directly (steps once per round, not per
# local epoch). See DriftFedAvgServer._cosine_lr() for the implementation.
# The eta_min value is still read by the server from lr_scheduler.eta_min.

method: ckadriftfedavg

# Experimental matrix — override dataset.name and dataset.partition_dir via CLI:
#   Datasets  : cifar10, brain_tumor
#   Models    : efficient0, efficient0_gn, efficient0_ln, vit_tiny, vim_tiny
#   Dirichlet α: 0.03, 0.1, 0.3, 1.0
dataset:
  name: cifar10
  partition_dir: partitions/alpha_1.0/seed_42

# Model names for the full experimental matrix:
#   efficient0, efficient0_gn, efficient0_ln, vit_tiny, vim_tiny
model:
  name: efficient0
  use_torchvision_pretrained_weights: false

optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 1.0e-4
  nesterov: false

# No client-side scheduler — server applies cosine decay per round.
lr_scheduler:
  name: null
  eta_min: 1.0e-5   # read by DriftFedAvgServer for cosine schedule

mode: parallel

parallel:
  ray_cluster_addr: null
  num_cpus: 40
  num_gpus: 0
  num_workers: 5

common:
  # Seeds 42, 123, and 456 are used for the three replicate runs of the thesis study.
  seed: 42
  join_ratio: 1.0          # 100% participation — all 10 clients every round
  global_epoch: 50         # communication rounds T
  local_epoch: 5           # local epochs E per round
  batch_size: 32
  dataloader_num_workers: 2
  reset_optimizer_on_global_epoch: true
  buffers: global
  straggler_ratio: 0
  client_side_evaluation: true

  test:
    client:
      interval: 1
      finetune_epoch: 0
      train: false
      val: false
      test: true
    server:
      interval: 1
      train: false
      val: false
      test: true
      model_in_train_mode: false

  verbose_gap: 10
  monitor: tensorboard
  use_cuda: true
  save_log: true
  save_model: false
  save_learning_curve_plot: true
  save_metrics: true
  delete_useless_run: true

# CKA measurement configuration.
# rounds          : explicit list of 1-based round indices at which to measure CKA.
#                   Dense at the start (rapid drift phase) and sparser later.
#                   Alternatively, use the legacy `interval: N` for every-N-rounds scheduling.
# client_sample   : max number of clients to measure per CKA round (sampled without replacement)
# probe_batches   : max batches of the probe dataloader consumed per CKA computation;
#                   set to -1 or 0 to consume the full dataloader
# probe_batch_size: batch size used exclusively for the CKA probe forward passes.
#                   Kept small (16) because CKA runs on CPU with two model copies
#                   collecting intermediate activations simultaneously.
#                   Independently of common.batch_size (used for training).
cka:
  rounds: [1, 2, 5, 10, 20, 30, 40, 50]
  client_sample: 10
  probe_batches: 20
  probe_batch_size: 16
