# config/driftscaffold.yaml
# Drift experiment configuration — SCAFFOLD (variance-reduction baseline)
# Methodology Section 3.1, Ablation 4

method: driftscaffold

dataset:
  name: cifar10
  partition_dir: partitions/alpha_1.0/seed_42

model:
  name: efficient0
  use_torchvision_pretrained_weights: false

optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 1.0e-4
  nesterov: false

# No client-side scheduler — server applies cosine decay per round.
lr_scheduler:
  name: null
  eta_min: 1.0e-5

mode: serial

common:
  seed: 42
  join_ratio: 1.0
  global_epoch: 40
  local_epoch: 5
  batch_size: 32
  dataloader_num_workers: 2
  reset_optimizer_on_global_epoch: true
  buffers: global
  straggler_ratio: 0
  client_side_evaluation: true

  test:
    client:
      interval: 1
      finetune_epoch: 0
      train: false
      val: false
      test: true
    server:
      interval: 1
      train: false
      val: false
      test: true
      model_in_train_mode: false

  verbose_gap: 10
  monitor: tensorboard
  use_cuda: true
  save_log: true
  save_model: false
  save_learning_curve_plot: true
  save_metrics: true
  delete_useless_run: true
  resume_checkpoint: null

# SCAFFOLD global learning rate (scales the aggregated y_delta update)
# Key must match the method name so main.py's parse_args wires it into
# args.driftscaffold.global_lr (not args.scaffold.global_lr).
driftscaffold:
  global_lr: 1.0
